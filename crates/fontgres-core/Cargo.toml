[package]
name = "fontgres-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "In-memory font database with CSS-like queries, forked from fontdb"
readme = "README.md"
keywords = ["font", "db", "css", "truetype", "ttf"]
categories = ["text-processing"]

[package.metadata.docs.rs]
all-features = true

[features]
# Derive `schemars::JsonSchema` on the public API models so MCP/rmcp consumers
# can advertise tool output schemas. Off by default to keep the core client free
# of the schemars dependency.
schema = ["dep:schemars"]
# Shared `completions` and `man` subcommand implementations for the binaries
# (the `cli` module). Off by default so library users don't pull in clap.
cli = ["dep:clap", "dep:clap_complete", "dep:clap_complete_nushell", "dep:clap_mangen"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
dirs.workspace = true
tracing.workspace = true
toml.workspace = true
schemars = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }
clap_complete_nushell = { workspace = true, optional = true }
clap_mangen = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
