[package]
name = "fontgres-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "In-memory font database with CSS-like queries"
readme = "README.md"
keywords = ["font", "db", "css", "truetype", "ttf"]
categories = ["text-processing"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std", "fs", "memmap", "fontconfig"]
std = []
# Allows local filesystem interactions.
fs = ["std"]
# Allows font files memory mapping, greatly improves performance.
memmap = ["fs", "dep:memmap2"]
# Enables minimal fontconfig support on Linux.
# Must be enabled for NixOS, otherwise no fonts will be loaded.
fontconfig = ["dep:fontconfig-parser", "fs"]
# The serializable font views, listings and query of the `models` module,
# with `Style` and `Stretch` read and written as CSS keywords by serde. Adds
# no dependency but serde.
serde = ["fs", "dep:serde"]
# Configuration loading, logging and the `completions`/`man` subcommand
# helpers shared by the workspace binaries, with `Style` and `Stretch` read
# as CSS keywords on the command line. Off by default, as is `serde`, so
# library users get only the font database.
cli = [
  "serde",
  "dep:clap",
  "dep:clap-verbosity-flag",
  "dep:clap_complete",
  "dep:clap_complete_nushell",
  "dep:clap_mangen",
  "dep:dirs",
  "dep:thiserror",
  "dep:toml",
  "dep:tracing",
  "dep:tracing-subscriber",
]
# Derive `schemars::JsonSchema` on the font views, the query, `Style` and
# `Stretch` so MCP consumers can advertise tool schemas.
schema = ["serde", "dep:schemars"]

[dependencies]
log.workspace = true
memmap2 = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
clap-verbosity-flag = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }
clap_complete_nushell = { workspace = true, optional = true }
clap_mangen = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
fontconfig-parser = { workspace = true, optional = true }

[dev-dependencies]
# The fontconfig rules build for tests on every host, not only on the
# platforms that read fontconfig.
fontconfig-parser.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

# A copy of [workspace.lints] (Cargo cannot override single workspace lints),
# with two differences: unsafe_code is deny rather than forbid, so the mmap
# site can carry #[expect(unsafe_code)]; and the public types must implement
# Copy and Debug where they can.
[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"
unused_lifetimes = "warn"
unused_qualifications = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
missing_crate_level_docs = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Public accessors and builders do not need a must_use annotation on every return value.
must_use_candidate = "allow"
# Domain names such as config/configs and request/response remain readable together.
similar_names = "allow"

# Keep functions small, matches exhaustive, and output deliberate
clone_on_ref_ptr = "warn"
cognitive_complexity = "warn"
exit = "warn"
infinite_loop = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_clone = "warn"
shadow_unrelated = "warn"
wildcard_enum_match_arm = "warn"

# Prevent panics from unwraps and unsafe slicing or indexing
arithmetic_side_effects = "warn"
expect_used = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
panic = "warn"
panic_in_result_fn = "warn"
string_slice = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"

# Prevent dropped futures and swallowed errors
assertions_on_result_states = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"

# Prevent unsafe things with memory
mem_forget = "warn"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"

# Prevent potentially incorrect things with numbers
float_cmp_const = "warn"
lossy_float_literal = "warn"

# Don't Do Bad Things That are Easy to Avoid
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
infallible_try_from = "warn"
rc_mutex = "warn"

# Don't `allow` Your Way Around These Lints - every suppression must be
# a deliberate #[expect(..., reason = "…")] rather than a silent #[allow]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
