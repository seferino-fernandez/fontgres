[package]
name = "fontgres-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Query installed fonts from the terminal"
readme = "README.md"
keywords = ["cli", "font", "css", "terminal"]
categories = ["command-line-utilities", "text-processing"]

# cargo-binstall fetches the archives release-binaries.yml attaches to each
# GitHub Release.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/fontgres-{ target }.{ archive-format }"
bin-dir = "fontgres{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "fontgres"
path = "src/main.rs"

[dependencies]
fontgres-core = { workspace = true, features = ["cli"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap = { workspace = true }
unicode-width.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
