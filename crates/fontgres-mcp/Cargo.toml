[package]
name = "fontgres-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Model Context Protocol server exposing the FONTGRES API to LLM clients"
readme = "README.md"
keywords = ["mcp", "mcp-server", "llm", "ai", "api"]
categories = ["api-bindings", "web-programming::http-server", "development-tools"]

[[bin]]
name = "fontgres-mcp"
path = "src/main.rs"

[dependencies]
fontgres-core = { workspace = true, features = ["cli", "schema"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap = { workspace = true }
clap_complete = { workspace = true }
clap-verbosity-flag = { workspace = true }
rmcp = {
  workspace = true,
  features = [
    "server",
    "transport-io",
    "macros",
    "schemars",
    "request-state",
  ]
}
schemars.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util"] }
base64.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true
