[package]
name = "fontgres-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Model Context Protocol server for querying installed fonts"
readme = "README.md"
keywords = ["mcp", "mcp-server", "llm", "font", "fontdb"]
categories = ["text-processing", "development-tools"]

# cargo-binstall fetches the archives release-binaries.yml attaches to each
# GitHub Release.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/fontgres-mcp-{ target }.{ archive-format }"
bin-dir = "fontgres-mcp{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "fontgres-mcp"
path = "src/main.rs"

[dependencies]
fontgres-core = { workspace = true, features = ["cli", "schema"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
clap = { workspace = true }
rmcp = {
  workspace = true,
  features = [
    "server",
    "transport-io",
    "macros",
    "schemars",
  ]
}
schemars.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util"] }
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
