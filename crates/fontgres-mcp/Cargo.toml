[package]
name = "fontgres-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Model Context Protocol server for querying installed fonts"
readme = "README.md"
keywords = ["mcp", "mcp-server", "llm", "font", "fontdb"]
categories = ["text-processing", "development-tools"]

[[bin]]
name = "fontgres-mcp"
path = "src/main.rs"

[dependencies]
fontgres-core = { workspace = true, features = ["cli", "schema"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap = { workspace = true }
clap_complete = { workspace = true }
clap-verbosity-flag = { workspace = true }
rmcp = {
  workspace = true,
  features = [
    "server",
    "transport-io",
    "macros",
    "schemars",
  ]
}
schemars.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util"] }
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
