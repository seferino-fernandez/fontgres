# release-plz: https://release-plz.dev/docs/config
# Workflow: .github/workflows/release-plz.yml. Process: docs/releasing.md.

[workspace]
# One tag and one GitHub Release for the whole workspace, anchored on
# fontgres-cli below; every crate still gets its changelog and a crates.io
# publish.
changelog_update = true
git_release_enable = false
git_tag_enable = false

[[package]]
name = "fontgres-cli"
git_release_enable = true
git_release_name = "fontgres v{{ version }}"
git_tag_enable = true
git_tag_name = "v{{ version }}"
